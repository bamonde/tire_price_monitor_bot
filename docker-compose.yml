services:
  monitor:
    build: .
    container_name: pneu-price-monitor
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: America/Sao_Paulo
      HISTORY_FILE: /app/data/nitro/price-history.jsonl
      WEBMOTORS_SEEN_FILE: /app/data/webmotors/seen.json
    volumes:
      - ./data:/app/data
